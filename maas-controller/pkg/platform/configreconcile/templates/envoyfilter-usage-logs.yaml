apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
  labels:
    app.kubernetes.io/part-of: maas-observability
    app.kubernetes.io/managed-by: maas-controller
    maas.opendatahub.io/config-usage: "true"
spec:
  workloadSelector:
    labels:
      maas-gateway: "true"
  configPatches:
  - applyTo: CLUSTER
    patch:
      operation: ADD
      value:
        name: otel_als_cluster
        type: STRICT_DNS
        connect_timeout: 5s
        http2_protocol_options: {}
        load_assignment:
          cluster_name: otel_als_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: {{.OTELHost}}
                    port_value: {{.OTELPort}}

  # ACTION 1: Runs FIRST. Solely catches the incoming request body 'model' field
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: INSERT_FIRST
      value:
        name: envoy.filters.http.lua.capture_model
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
          default_source_code:
            inline_string: |
              function envoy_on_request(request_handle)
                local path = request_handle:headers():get(":path")
                if path and string.match(path, "/v1/chat/completions") then
                  local req_body = request_handle:body()
                  if req_body then
                    local req_body_str = req_body:getBytes(0, req_body:length())
                    local model = string.match(req_body_str, '"model"%s*:%s*"([^"]+)"')
                    if model then
                      request_handle:streamInfo():dynamicMetadata():set("envoy.filters.http.json_to_metadata", "model", model)
                    else
                      request_handle:streamInfo():dynamicMetadata():set("envoy.filters.http.json_to_metadata", "model", "unknown")
                    end
                  end
                end
              end

  # ACTION 2: Runs BEFORE the router. Strips identity tracking headers and parses LLM token counts
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
            subFilter:
              name: envoy.filters.http.router
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.lua.process_and_clean
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
          default_source_code:
            inline_string: |
              function envoy_on_request(request_handle)
                local path = request_handle:headers():get(":path")
                if path and string.match(path, "/v1/chat/completions") then
                  -- Set an internal marker so envoy_on_response knows to capture tokens later
                  request_handle:streamInfo():dynamicMetadata():set("envoy.filters.http.custom_maas", "is_completions", "true")

                  -- Strip tracking variables completely before moving upstream to backend LLMs
                  request_handle:headers():remove("X-MaaS-Username")
                  request_handle:headers():remove("X-MaaS-Group")
                  request_handle:headers():remove("X-MaaS-Key-Id")
                end
              end

              function envoy_on_response(response_handle)
                local meta = response_handle:streamInfo():dynamicMetadata():get("envoy.filters.http.custom_maas")
                if meta and meta["is_completions"] == "true" then
                  local body = response_handle:body()
                  if body then
                    local body_str = body:getBytes(0, body:length())
                    local total_tokens = string.match(body_str, '"total_tokens"%s*:%s*(%d+)')
                    local prompt_tokens = string.match(body_str, '"prompt_tokens"%s*:%s*(%d+)')
                    local completion_tokens = string.match(body_str, '"completion_tokens"%s*:%s*(%d+)')

                    response_handle:streamInfo():dynamicMetadata():set("envoy.filters.http.json_to_metadata", "tokens_total", total_tokens or "0")
                    response_handle:streamInfo():dynamicMetadata():set("envoy.filters.http.json_to_metadata", "tokens_prompt", prompt_tokens or "0")
                    response_handle:streamInfo():dynamicMetadata():set("envoy.filters.http.json_to_metadata", "tokens_completion", completion_tokens or "0")
                  end
                end
              end

  # OpenTelemetry Access Logger Configuration
  - applyTo: NETWORK_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: MERGE
      value:
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          access_log:
          - name: envoy.access_loggers.open_telemetry
            filter:
              extension_filter:
                name: envoy.access_loggers.extension_filters.cel
                typed_config:
                  '@type': type.googleapis.com/envoy.extensions.access_loggers.filters.cel.v3.ExpressionFilter
                  expression: "request.path.endsWith('/v1/chat/completions')"
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.access_loggers.open_telemetry.v3.OpenTelemetryAccessLogConfig
              common_config:
                log_name: maas-usage-log
                transport_api_version: V3
                grpc_service:
                  envoy_grpc:
                    cluster_name: otel_als_cluster
              body:
                string_value: '%REQ(:METHOD)% %REQ(:PATH)% %RESPONSE_CODE%'
              attributes:
                values:
                - key: request_id
                  value:
                    string_value: '%REQ(X-REQUEST-ID)%'
                - key: method
                  value:
                    string_value: '%REQ(:METHOD)%'
                - key: path
                  value:
                    string_value: '%REQ(:PATH)%'
                - key: authority
                  value:
                    string_value: '%REQ(:AUTHORITY)%'
                - key: response_code
                  value:
                    string_value: '%RESPONSE_CODE%'
                - key: response_type
                  value:
                    string_value: '%CEL(response.code >= 200 && response.code < 300 ? "hit" : (response.code == 429 ? "rate_limit" : "error"))%'
                - key: upstream_cluster
                  value:
                    string_value: '%UPSTREAM_CLUSTER%'
                - key: duration_ms
                  value:
                    string_value: '%DURATION%'
                - key: bytes_received
                  value:
                    string_value: '%BYTES_RECEIVED%'
                - key: bytes_sent
                  value:
                    string_value: '%BYTES_SENT%'
                - key: response_code_details
                  value:
                    string_value: '%RESPONSE_CODE_DETAILS%'
                - key: downstream_remote_address
                  value:
                    string_value: '%DOWNSTREAM_REMOTE_ADDRESS%'
                - key: route_name
                  value:
                    string_value: '%ROUTE_NAME%'
                - key: subscription
                  value:
                    string_value: '%REQ(X-MaaS-Subscription)%'
                
                # NATIVE DIRECT EXT_AUTHZ LOOKUPS (No Lua filters needed here anymore!)
                - key: user_id
                  value:
                    string_value: '%DYNAMIC_METADATA(envoy.filters.http.ext_authz:identity.userid)%'
                - key: groups
                  value:
                    string_value: '%DYNAMIC_METADATA(envoy.filters.http.ext_authz:identity.groups_str)%'
                - key: key_id
                  value:
                    string_value: '%DYNAMIC_METADATA(envoy.filters.http.ext_authz:identity.keyId)%'
                
                # Output Token Metrics Processing
                - key: tokens_total
                  value:
                    string_value: '%DYNAMIC_METADATA(envoy.filters.http.json_to_metadata:tokens_total)%'
                - key: tokens_prompt
                  value:
                    string_value: '%DYNAMIC_METADATA(envoy.filters.http.json_to_metadata:tokens_prompt)%'
                - key: tokens_completion
                  value:
                    string_value: '%DYNAMIC_METADATA(envoy.filters.http.json_to_metadata:tokens_completion)%'
                - key: model
                  value:
                    string_value: '%DYNAMIC_METADATA(envoy.filters.http.json_to_metadata:model)%'
              resource_attributes:
                values:
                - key: service.name
                  value:
                    string_value: maas-gateway
                - key: service.namespace
                  value:
                    string_value: {{.Namespace}}
