apiVersion: dscinitialization.opendatahub.io/v1
kind: DSCInitialization
metadata:
  name: default-dsci
  namespace: opendatahub
spec:
  # Namespace where ODH applications will be deployed
  applicationsNamespace: opendatahub
  
  # Monitoring configuration for ODH components
  monitoring:
    managementState: Managed
    namespace: opendatahub
    logs:
      endpoint: "https://lokistack-sample-gateway-http.logging.svc.cluster.local:8080/api/logs/v1/application/otlp" 
  
  # Trusted CA bundle for TLS certificates
  trustedCABundle:
    managementState: Managed 
